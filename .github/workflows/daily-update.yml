name: Daily Regulatory Update

on:
  schedule:
    - cron: '0 1 * * *'   # 每天 01:00 UTC = 北京时间 09:00
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/bold-darwin-9biG6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm install --prefix api

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: api/foodreg.db
          key: foodreg-db-${{ github.run_number }}
          restore-keys: |
            foodreg-db-

      - name: Initialize DB (if first run)
        run: node -e "import('./api/db.js').then(m => { m.initDB(); console.log('DB ready'); })"

      - name: Collect RSS updates
        run: node api/collect.js

      - name: Build frontend
        run: |
          npm install --prefix webapp
          npm run build --prefix webapp

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f api/foodreg.db
          git diff --cached --quiet || git commit -m "chore: daily regulatory data update $(date -u '+%Y-%m-%d')"
          git push
